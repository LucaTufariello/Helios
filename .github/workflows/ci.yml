name: Native application and shared core

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop-linux:
    name: Qt desktop compile and core tests on Arch Linux
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    timeout-minutes: 25
    steps:
      - name: Install a consistent Arch toolchain and Qt modules
        run: pacman -Syu --noconfirm --needed git cmake qt6-base qt6-shadertools

      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Compile desktop and run headless core tests
        run: make test-desktop

  shared-linux:
    name: Shared C++ core on Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Build and test portable geography
        run: make test-shared

  verify:
    name: Apple Silicon build and tests
    runs-on: macos-15
    timeout-minutes: 90
    env:
      GODEYE_SAR_RUNTIME: ${{ runner.temp }}/godeye-raster
      GODEYE_SAR_PYTHON: ${{ runner.temp }}/godeye-raster/bin/python3
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Verify Apple Silicon and install build tools
        run: |
          test "$(uname -m)" = arm64
          brew install cmake pkgconf
          xcodebuild -version

      - name: Check Swift formatting
        run: make format-check

      - name: Build and test the shared C++ core
        run: make test-shared

      - name: Run native tests
        run: make test

      - name: Prepare raster test environment
        run: |
          python3 -m venv "$GODEYE_SAR_RUNTIME"
          "$GODEYE_SAR_PYTHON" -m pip install -r native/macos/Sources/GodEyeMac/Resources/SAR/requirements.txt

      - name: Run SAR and optical tests
        run: make test-raster

      - name: Build and verify native application
        run: make build
