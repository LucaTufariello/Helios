name: Feature request
description: Propose a new layer, data source, tool, or UI capability.
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        GodEye is a native macOS analysis workspace for public assets, infrastructure and systems. Review DATA_SOURCES.md for attribution and use restrictions before proposing a source; do not propose identification or tracking of individuals.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can you not do today, and who needs it?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should it do? Keep the first version small.
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Data source, license, and attribution
      description: For anything that shows data, link the feed or API, name its license, and say whether it works without a key. Write "none" for pure UI changes.
    validations:
      required: true
  - type: dropdown
    id: contribute
    attributes:
      label: Will you build it?
      options:
        - Yes, I plan to open a PR
        - No, this is a request for someone else
    validations:
      required: true
