name: Bug report
description: A native workflow, build, data source or renderer fails.
title: "bug: "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Expected behavior and what you saw instead. Redact credentials and private mission data.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Build with make build and open output/native/GodEye.app
        2. Open Satellite, choose a source and region
        3. Describe the failing action
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: macOS, chip and Xcode version
      placeholder: "macOS 27, Apple M2, Xcode 27"
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Version or commit
      description: Output of git rev-parse --short HEAD, or the release tag.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Relevant diagnostics
      description: Sanitized app/worker/build error excerpts, source/product identifier and processing versions where relevant. Do not attach full private products or credentials.
      render: text
